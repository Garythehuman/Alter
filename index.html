<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Offline-first currency converter. Rates update automatically when online.">
  <meta name="theme-color" content="#1a1d24">
  <title>Alter — Currency Exchange</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Alter</h1>
      <div class="status-row">
        <span id="connection-badge" class="badge">…</span>
        <span id="rates-age" class="rates-age"></span>
      </div>
    </header>

    <section class="converter" aria-label="Currency converter">
      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" type="number" inputmode="decimal" min="0" step="any" value="1" autocomplete="off">
      </div>

      <div class="currency-row">
        <div class="field">
          <label for="from-currency">From</label>
          <select id="from-currency"></select>
        </div>
        <button id="swap" class="swap-btn" type="button" aria-label="Swap currencies" title="Swap">⇅</button>
        <div class="field">
          <label for="to-currency">To</label>
          <select id="to-currency"></select>
        </div>
      </div>

      <output id="result" class="result" for="amount from-currency to-currency">—</output>
      <p id="unit-rate" class="unit-rate"></p>
    </section>

    <footer class="footer">
      <p id="source-note">Rates by <a href="https://www.exchangerate-api.com" rel="noopener">Exchange Rate API</a> · stored on this device for offline use.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
